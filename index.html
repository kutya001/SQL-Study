  <!-- Движок T-SQL и учебная база -->
  <script src="js/engine/tsql-core.js"></script>
  <script src="js/engine/tsql-parser.js"></script>

  <!-- Настройки курса -->
  <script src="content/course.js"></script>
  <script>
    // Последовательная загрузка модулей курса и приложения
    (function () {
      var files = COURSE.moduleFiles.map(function (f) { return 'content/modules/' + f; })
        .concat(['content/trainer.js', 'content/cheatsheet.js', '?schemas/index.js',
          'js/app/util.js', 'js/app/storage.js', 'js/app/registry.js', 'js/app/editor.js', 'js/app/grid.js',
          'js/app/checker.js', 'js/app/widgets.js', 'js/app/app.js', 'js/app/schemapanel.js', 'js/app/pages.js', 'js/app/packpages.js']);
      var failed = [];
      function next(i) {
        if (i >= files.length) {
          if (failed.length) {
            document.getElementById('view').innerHTML = '<div class="page"><div class="err-box">Не удалось загрузить файлы: ' + failed.join(', ') + '. Проверьте, что архив распакован полностью.</div></div>';
            if (!window.App) return;
          }
          App.start();
          return;
        }
        // «?» в начале — необязательный файл (его может не быть)
        var optional = files[i].charAt(0) === '?', src = optional ? files[i].slice(1) : files[i];
        var s = document.createElement('script');
        s.src = src;
        s.onload = function () { next(i + 1); };
        s.onerror = function () { if (!optional) failed.push(src); next(i + 1); };
        document.body.appendChild(s);
      }
      next(0);
    })();
  </script>
</body>
